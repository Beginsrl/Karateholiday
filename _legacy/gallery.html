<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria Foto - Karate Holiday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-page-header {
            padding-top: 120px;
            padding-bottom: 50px;
            background: var(--color-blue);
            color: white;
            text-align: center;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 50px 0;
        }

        .gallery-item {
            height: 250px;
            background-color: #ddd;
            overflow: hidden;
            border-radius: 10px;
            position: relative;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <header class="header scrolled">
        <div class="container header-container">
            <div class="logo">
                <a href="index.html">
                    <span>KARATE HOLIDAY</span>
                </a>
            </div>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="index.html">Torna alla Home</a></li>
                </ul>
            </nav>
            <a href="index.html#prenota" class="btn btn-primary">PRENOTA</a>
        </div>
    </header>

    <div class="gallery-page-header">
        <div class="container">
            <h1>I Momenti Più Belli</h1>
            <p>Scatti dalle edizioni passate</p>
        </div>
    </div>

    <div class="container">
        <div class="gallery-grid">
            <!-- Placeholders -->
            <div class="gallery-item"><img src="https://placehold.co/400x400?text=Foto+1" alt="Foto"></div>
            <div class="gallery-item"><img src="https://placehold.co/400x400?text=Foto+2" alt="Foto"></div>
            <div class="gallery-item"><img src="https://placehold.co/400x400?text=Foto+3" alt="Foto"></div>
            <div class="gallery-item"><img src="https://placehold.co/400x400?text=Foto+4" alt="Foto"></div>
            <div class="gallery-item"><img src="https://placehold.co/400x400?text=Foto+5" alt="Foto"></div>
            <div class="gallery-item"><img src="https://placehold.co/400x400?text=Foto+6" alt="Foto"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Karate Holiday. Tutti i diritti riservati.</p>
        </div>
    </footer>

</body>

</html>
